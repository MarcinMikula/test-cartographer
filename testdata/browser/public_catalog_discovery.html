<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Public catalog discovery reference</title>
</head>
<body>
  <main>
    <h1>Catalog</h1>
    <form id="catalog-search" aria-label="Catalog search form">
      <label for="catalog-query">Search catalog</label>
      <input
        id="catalog-query"
        name="query"
        type="search"
        placeholder="Enter a catalog query"
        value="do-not-persist-this-input-value"
      >
      <button type="submit" data-testid="search-submit">Search</button>
      <button type="button" data-testid="search-help">Search</button>
    </form>
    <ul aria-label="Catalog results" data-testid="catalog-results">
      <li>Example item</li>
    </ul>
  </main>
  <script>
    const form = document.querySelector('#catalog-search');
    const results = document.querySelector('[data-testid="catalog-results"]');
    form.addEventListener('submit', event => {
      event.preventDefault();
      results.setAttribute('data-search-state', 'submitted');
    });
  </script>
</body>
</html>

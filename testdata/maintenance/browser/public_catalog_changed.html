<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Public catalog changed reference</title>
</head>
<body>
  <main>
    <h1>Catalog</h1>
    <form id="catalog-search" aria-label="Catalog search form">
      <label for="catalog-query">Search catalog</label>
      <input id="catalog-query" name="query" type="search" placeholder="Enter a catalog query">
      <button type="submit" data-testid="catalog-search-submit">Search</button>
      <button type="button" data-testid="search-help">Search</button>
    </form>
    <ul aria-label="Catalog results" data-testid="catalog-results">
      <li>Example item</li>
    </ul>
  </main>
  <script>
    const form = document.querySelector('#catalog-search');
    const input = document.querySelector('#catalog-query');
    const results = document.querySelector('[data-testid="catalog-results"]');
    form.addEventListener('submit', event => {
      event.preventDefault();
      results.textContent = `${input.value || 'Example'} item`;
      results.setAttribute('data-search-state', 'submitted');
    });
  </script>
</body>
</html>

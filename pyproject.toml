[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "test-cartographer"
version = "0.2.0"
description = "LLM-assisted application discovery and framework adaptation for maintainable test automation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Marcin Mikuła" },
]
dependencies = [
    "pydantic>=2.11,<3",
]

[project.scripts]
test-cartographer = "test_cartographer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
